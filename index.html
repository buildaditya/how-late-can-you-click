<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>How Late Can You Click?</title>
  <meta name="description" content="A minimalist reaction time game where you must click as late as possible before the window closes." />
  <meta property="og:title" content="How Late Can You Click?" />
  <meta property="og:description" content="A minimalist reaction time game where you must click as late as possible before the window closes." />
  <style>
    :root {
      --bg: #0f0f11;
      --fg: #f3f4f6;
      --fg-muted: #9ca3af;
      --accent: #ffffff;
      --btn-bg: #1f2937;
      --btn-hover: #374151;
      --btn-active: #4b5563;
      --btn-border: #374151;
      --success: #4ade80;
      --danger: #f87171;
    }
    
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      display: grid;
      grid-template-rows: 1fr;
      grid-template-columns: 1fr;
      place-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 2rem;
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2rem;
      width: 100%;
      max-width: 440px;
    }

    .screen.active {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.25rem;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .instruction {
      font-size: 1.125rem;
      color: var(--fg-muted);
      line-height: 1.5;
      margin: 0;
    }

    button {
      background-color: var(--btn-bg);
      color: var(--fg);
      border: 1px solid var(--btn-border);
      padding: 1rem 2.5rem;
      font-size: 1.125rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.1s, border-color 0.1s, transform 0.1s, opacity 0.2s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover:not(:disabled) {
      background-color: var(--btn-hover);
      border-color: var(--fg-muted);
    }

    button:active:not(:disabled) {
      background-color: var(--btn-active);
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    #game-btn {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      font-size: 2rem;
      font-weight: 700;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 2px solid var(--btn-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2rem 0;
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.1s, box-shadow 0.1s, opacity 0.2s;
    }

    #game-btn:hover:not(:disabled) {
      border-color: var(--fg);
      box-shadow: 0 12px 48px rgba(255,255,255,0.05);
      transform: scale(1.02);
    }

    #game-btn:active:not(:disabled) {
      transform: scale(0.92);
      border-color: var(--success);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition-duration: 0.05s;
    }

    .display-text {
      font-size: 3.5rem;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: -0.02em;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pulse-hit {
      animation: pulseHit 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shake-miss {
      animation: shakeMiss 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes pulseHit {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes shakeMiss {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen.active, .pulse-hit, .shake-miss {
        animation: none !important;
      }
    }

    #feedback-display {
      font-size: 1.25rem;
      font-weight: 500;
      min-height: 2rem;
      transition: opacity 0.2s, color 0.2s;
    }

    #round-display {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      color: var(--fg-muted);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: none;
    }

    #screen-result {
      background: var(--btn-bg);
      padding: 3rem 2rem;
      border-radius: 24px;
      border: 1px solid var(--btn-border);
    }

    .result-value {
      font-size: 4.5rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      margin: 1rem 0;
      line-height: 1;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      width: 100%;
      margin-top: 1rem;
      flex-direction: column;
    }
    
    @media (min-width: 480px) {
      .btn-group {
        flex-direction: row;
      }
      .btn-group button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div id="round-display">Round <span id="round-number">1</span>/7</div>
  
  <div id="app">
    <!-- Start Screen -->
    <div id="screen-start" class="screen active">
      <h1>How Late Can You Click?</h1>
      <p class="instruction">A button will appear. Click it as late as possible before the time runs out. You have 7 rounds.</p>
      <button id="btn-start">Start</button>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen">
      <div id="time-display" class="display-text">1.200s</div>
      <button id="game-btn">CLICK</button>
      <div id="feedback-display">&nbsp;</div>
    </div>

    <!-- Result Screen -->
    <div id="screen-result" class="screen">
      <h1>Game Over</h1>
      <div class="result-value" id="best-time-display">0.000s</div>
      <p class="instruction" id="best-sentence">Your best: 0.000 seconds left</p>
      <div class="btn-group">
        <button id="btn-copy">Copy result</button>
        <button id="btn-again">Play again</button>
      </div>
    </div>
  </div>

  <script>
    const screenStart = document.getElementById('screen-start');
    const screenGame = document.getElementById('screen-game');
    const screenResult = document.getElementById('screen-result');
    const roundDisplay = document.getElementById('round-display');
    const roundNumber = document.getElementById('round-number');
    
    const timeDisplay = document.getElementById('time-display');
    const gameBtn = document.getElementById('game-btn');
    const feedbackDisplay = document.getElementById('feedback-display');
    
    const bestTimeDisplay = document.getElementById('best-time-display');
    const bestSentence = document.getElementById('best-sentence');
    const btnStart = document.getElementById('btn-start');
    const btnCopy = document.getElementById('btn-copy');
    const btnAgain = document.getElementById('btn-again');

    const TOTAL_ROUNDS = 7;
    const START_DURATION = 1200;
    const DURATION_STEP = 120;

    let currentRound = 1;
    let bestTime = null;
    let roundStartTime = 0;
    let currentDuration = 0;
    let rAF_ID = null;
    let isRoundActive = false;
    let hasClicked = false;

    function showScreen(screen) {
      screenStart.classList.remove('active');
      screenGame.classList.remove('active');
      screenResult.classList.remove('active');
      screen.classList.add('active');
      
      roundDisplay.style.display = screen === screenGame ? 'block' : 'none';
    }

    btnStart.addEventListener('click', startGame);
    btnAgain.addEventListener('click', startGame);
    btnCopy.addEventListener('click', copyResult);

    function startGame() {
      currentRound = 1;
      bestTime = null;
      showScreen(screenGame);
      startRound();
    }

    function formatTime(ms) {
      return (Math.max(0, ms) / 1000).toFixed(3);
    }

    function startRound() {
      if (currentRound > TOTAL_ROUNDS) {
        endGame();
        return;
      }

      roundNumber.textContent = currentRound;
      currentDuration = START_DURATION - (currentRound - 1) * DURATION_STEP;
      
      feedbackDisplay.style.opacity = '0';
      feedbackDisplay.textContent = '-';
      
      gameBtn.disabled = true;
      gameBtn.style.opacity = '0';
      gameBtn.style.transform = 'scale(0.8)';
      gameBtn.style.pointerEvents = 'none';
      
      timeDisplay.classList.remove('pulse-hit', 'shake-miss');
      
      hasClicked = false;
      isRoundActive = false;
      
      timeDisplay.textContent = 'Ready...';
      timeDisplay.style.color = 'var(--fg-muted)';

      setTimeout(() => {
        gameBtn.disabled = false;
        gameBtn.style.opacity = '1';
        gameBtn.style.transform = 'scale(1)';
        gameBtn.style.pointerEvents = 'auto';
        
        timeDisplay.style.color = 'var(--fg)';
        isRoundActive = true;
        roundStartTime = performance.now();
        rAF_ID = requestAnimationFrame(updateTimer);
      }, 1000);
    }

    function updateTimer(timestamp) {
      if (!isRoundActive) return;

      const elapsed = timestamp - roundStartTime;
      const remaining = currentDuration - elapsed;

      if (remaining <= 0) {
        handleMiss();
      } else {
        timeDisplay.textContent = formatTime(remaining) + 's';
        rAF_ID = requestAnimationFrame(updateTimer);
      }
    }

    function handleMiss() {
      if (!isRoundActive) return;
      isRoundActive = false;
      gameBtn.disabled = true;
      timeDisplay.textContent = '0.000s';
      timeDisplay.style.color = 'var(--danger)';
      timeDisplay.classList.add('shake-miss');
      showFeedback('Missed', 'var(--danger)');
      
      setTimeout(() => {
        currentRound++;
        startRound();
      }, 1500);
    }

    function handleGameClick(e) {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      
      if (!isRoundActive || hasClicked) return;
      
      hasClicked = true;
      isRoundActive = false;
      cancelAnimationFrame(rAF_ID);
      
      const elapsed = performance.now() - roundStartTime;
      const remaining = Math.max(0, currentDuration - elapsed);

      if (bestTime === null || remaining < bestTime) {
        bestTime = remaining;
      }

      gameBtn.disabled = true;
      const formatted = formatTime(remaining);
      timeDisplay.textContent = formatted + 's';
      timeDisplay.style.color = 'var(--success)';
      timeDisplay.classList.add('pulse-hit');
      showFeedback(formatted + 's left', 'var(--success)');

      setTimeout(() => {
        currentRound++;
        startRound();
      }, 1500);
    }

    gameBtn.addEventListener('pointerdown', handleGameClick);
    gameBtn.addEventListener('keydown', handleGameClick);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isRoundActive) {
        handleMiss();
      }
    });

    function showFeedback(text, color) {
      feedbackDisplay.textContent = text;
      feedbackDisplay.style.color = color;
      feedbackDisplay.style.opacity = '1';
    }

    function endGame() {
      showScreen(screenResult);
      if (bestTime === null) {
        bestTimeDisplay.textContent = 'Missed';
        bestSentence.textContent = 'You missed every round!';
      } else {
        const formatted = formatTime(bestTime);
        bestTimeDisplay.textContent = formatted + 's';
        bestSentence.textContent = `You got as close as ${formatted}s`;
      }
      btnCopy.textContent = 'Copy result';
    }

    function copyResult() {
      const timeStr = bestTime === null ? 'Missed all' : formatTime(bestTime) + 's';
      const text = `How Late Can You Click?\nBest: ${timeStr} remaining.\nCan you beat it?`;
      
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          btnCopy.textContent = 'Copied!';
          setTimeout(() => btnCopy.textContent = 'Copy result', 2000);
        }).catch(() => {
          btnCopy.textContent = 'Failed to copy';
        });
      } else {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
          btnCopy.textContent = 'Copied!';
          setTimeout(() => btnCopy.textContent = 'Copy result', 2000);
        } catch (err) {
          btnCopy.textContent = 'Failed to copy';
        }
        document.body.removeChild(textArea);
      }
    }
  </script>
</body>
</html>
